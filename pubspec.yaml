name: emplake_da_bia
description: "Aplicativo Emplake - Engenharia Reversa em Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Estado e rotas
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_ui_auth: ^1.16.0
  firebase_ui_oauth_google: ^1.4.0
  firebase_ui_localizations: ^1.14.1

  # UI / animação / progresso
  curved_navigation_bar: ^1.0.6
  flutter_math_fork: ^0.7.2
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  country_flags: ^4.0.0

  # Persistência local
  shared_preferences: ^2.3.2

  material_ui: any
  cupertino_ui: any
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
